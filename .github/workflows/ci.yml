name: CI

on:
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Go unit & integration tests
        run: go test ./...

      - name: CLI integration tests
        run: go test -tags cli -v -count=1 ./tests/cli/
