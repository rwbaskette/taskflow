name: CI

on:
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags integration -v -count=1 ./...
